name: Traffic-only card browser smoke test
on:
  pull_request:
    paths:
      - 'components/WeatherCard.vue'
      - 'layouts/default.vue'
      - 'utils/trafficMap.js'
      - 'tests/traffic-command-browser.mjs'
  push:
    branches: [feature/traffic-command-card]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/traffic-command-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traffic-only-card-preview
          path: preview-output/

name: Weather and traffic checks

on:
  pull_request:
    paths:
      - 'components/WeatherCard.vue'
      - 'shared/**'
      - 'server/**'
      - 'tests/**'
      - 'utils/trafficMap.js'
      - 'nuxt.config.ts'
      - 'package.json'
      - '.github/workflows/traffic-ci.yml'
  push:
    branches: [feature/openfreemap-live-traffic]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
